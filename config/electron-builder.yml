appId: com.biny.desktop
productName: Biny
asar: true
asarUnpack:
  - out/main/chunks/**/*
  - node_modules/zod/**/*
  - node_modules/onnxruntime-node/**/*
  - node_modules/onnxruntime-web/**/*.wasm
  - node_modules/@huggingface/transformers/**/*.wasm
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - "!out/rtk/**/*"
  - dist/**/*
  - package.json
extraResources:
  - from: out/rtk/${arch}
    to: rtk
  - from: THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
    filter:
      - '*.txt'
      - node-runtime-NOTICE.md
  - from: build/icon-master.png
    to: native/tray-icon.png
mac:
  extraResources:
    - from: out/native/activity-input-monitor
      to: native/activity-input-monitor
    - from: out/native/activity-ocr
      to: native/activity-ocr
    - from: out/native/computer-use.app
      to: native/computer-use.app
    - from: out/native/calendar-reader
      to: native/calendar-reader
  extendInfo:
    LSUIElement: true
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: true
  target:
    - dmg
win:
  icon: build/icon.ico
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
dmg:
  title: Biny ${version}
artifactName: Biny-${version}-${arch}.${ext}
npmRebuild: false
