<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><title>Biny Cua Fixture</title><style>body{font:18px system-ui;padding:24px;margin:0}h1{font-size:28px}button,input{font:inherit;margin:10px;padding:10px}.scroll{width:540px;height:230px;overflow:auto;border:1px solid #555}.canvas{position:relative;width:1800px;height:1400px;background:linear-gradient(90deg,#d6e8ff 1px,transparent 1px),linear-gradient(#d6e8ff 1px,transparent 1px);background-size:100px 100px}.canvas span{position:absolute;color:#234;white-space:nowrap}.canvas span:nth-child(1){top:8px;left:8px}.canvas span:nth-child(2){top:550px;left:600px}.canvas span:nth-child(3){bottom:8px;right:8px}</style></head><body>
<h1>Biny Cua Fixture · synthetic only</h1><p>只含测试文本，无个人信息。点击应改变计数，输入不离开窗口。</p>
<button id="increment">增加计数</button><output id="count" aria-live="polite">0</output><label>测试输入<input id="input" aria-label="测试输入" value="fixture-only"></label>
<div class="scroll" role="region" tabindex="0" aria-label="测试滚动区域"><div class="canvas"><span>合成左上角 · x0 y0</span><span>合成中心 · x600 y550</span><span>合成右下角 · x1800 y1400</span><button id="scroll-target" style="position:sticky;top:40px;left:40px;z-index:1;background:white" aria-label="测试滚动目标">测试滚动目标</button></div></div>
<script>let count=0;document.getElementById('increment').addEventListener('click',()=>{document.getElementById('count').textContent=String(++count)});</script>
</body></html>
