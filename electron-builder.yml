appId: com.biny.desktop
productName: Biny
asar: true
asarUnpack:
  - node_modules/onnxruntime-node/**/*
  - node_modules/onnxruntime-web/**/*.wasm
  - node_modules/@huggingface/transformers/**/*.wasm
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - dist/**/*
  - package.json
extraResources:
  - from: out/native/activity-input-monitor
    to: native/activity-input-monitor
  - from: out/native/activity-ocr
    to: native/activity-ocr
  - from: out/native/computer-use
    to: native/computer-use
  - from: out/native/calendar-reader
    to: native/calendar-reader
  - from: build/icon-master.png
    to: native/tray-icon.png
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: true
  target:
    - dmg
    - zip
dmg:
  title: Biny ${version}
artifactName: Biny-${version}-${arch}.${ext}
npmRebuild: false
