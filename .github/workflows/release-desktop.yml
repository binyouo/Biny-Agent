name: Release macOS app

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
      unsigned:
        description: Publish a Beta without Developer ID signing or notarization
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_UNSIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.unsigned || false }}

jobs:
  validate:
    name: Validate tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile && pnpm exec install-electron --no

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: xvfb-run -a pnpm test && node --test scripts/release-desktop.test.mjs

      - name: Validate bundled Code Mode runtime
        run: pnpm build:desktop && pnpm test:code-mode-package

  build:
    name: Build ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG#v}" = "$package_version"

      - name: Verify macOS signing configuration
        run: |
          if [[ "$RELEASE_UNSIGNED" == "true" ]]; then
            [[ "$RELEASE_TAG" == *-beta.* ]] || { echo "Unsigned releases must be Beta versions" >&2; exit 1; }
            echo "Building a Beta without Developer ID signing or notarization"
            exit 0
          fi
          test -n "$CSC_LINK" || { echo "Missing MACOS_CERTIFICATE_BASE64" >&2; exit 1; }
          test -n "$CSC_KEY_PASSWORD" || { echo "Missing MACOS_CERTIFICATE_PASSWORD" >&2; exit 1; }
          test -n "$APPLE_ID" || { echo "Missing APPLE_ID" >&2; exit 1; }
          test -n "$APPLE_APP_SPECIFIC_PASSWORD" || { echo "Missing APPLE_APP_SPECIFIC_PASSWORD" >&2; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo "Missing APPLE_TEAM_ID" >&2; exit 1; }

      - name: Build macOS package
        run: |
          pnpm build:desktop
          pnpm test:code-mode-package
          args=(--mac dmg zip --${{ matrix.arch }} --publish never)
          if [[ "$RELEASE_UNSIGNED" == "true" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            args+=(--config.mac.identity=- --config.mac.hardenedRuntime=false --config.mac.gatekeeperAssess=false --config.mac.notarize=false)
          fi
          pnpm exec electron-builder "${args[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          merge-multiple: true
          path: release-assets

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum ./*.dmg ./*.zip > SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=()
          if [[ "$RELEASE_UNSIGNED" == "true" ]]; then
            cat > release-notes.md <<'EOF'
          Biny 是本地优先、记忆优先的开发协作 Agent，提供 macOS Desktop、TUI 与 CLI，支持通过 MCP、Skills 和插件扩展。

          ### macOS Beta 安装
          - Apple Silicon 下载 `arm64.dmg`；Intel 下载 `x64.dmg`。打开 DMG 后将 Biny 拖入 Applications；ZIP 提供相同 App 的压缩包。
          - 此 Beta 未使用 Apple Developer ID 签名或公证。首次打开可能被 macOS 拦截；确认下载来源后，在“系统设置 → 隐私与安全性”中选择“仍要打开”。[Apple 操作说明](https://support.apple.com/en-us/102445)
          - `SHA256SUMS.txt` 提供全部 DMG / ZIP 的校验值，可使用 `shasum -a 256 <下载文件>` 核对。
          - 首次使用请配置模型服务商；桌面观察与操作需要相应的 macOS 权限。配置入口见 [用户文档](https://github.com/binyouo/Biny-Agent/blob/main/docs/README.md)。
          - 此版本供测试使用；安装、首次启动及界面交互待人工验收。
          EOF
            notes+=(--notes-file release-notes.md)
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            if [[ "$RELEASE_TAG" == *-* ]]; then
              gh release create "$RELEASE_TAG" release-assets/* --title "Biny ${RELEASE_TAG#v}" --generate-notes --prerelease "${notes[@]}"
            else
              gh release create "$RELEASE_TAG" release-assets/* --title "Biny ${RELEASE_TAG#v}" --generate-notes
            fi
          fi
