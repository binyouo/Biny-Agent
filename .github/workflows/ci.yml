name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *"
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Test impact plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      standard: ${{ steps.plan.outputs.standard }}
      e2e: ${{ steps.plan.outputs.e2e }}
      build: ${{ steps.plan.outputs.build }}
      renderer: ${{ steps.plan.outputs.renderer }}
      windows: ${{ steps.plan.outputs.windows }}
      windows_package: ${{ steps.plan.outputs.windows_package }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - id: plan
        name: Select tests since the last successful ancestor
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-test-plan.mjs --ci
      - uses: actions/upload-artifact@v7
        with:
          name: ci-plan
          path: .ci/plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changed patch
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              git diff --check HEAD^ HEAD
            else
              git diff-tree --check --no-commit-id -r HEAD
            fi
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            # 强制 push 或分支重建后，before SHA 可能不在当前 checkout 的历史里。
            # 此时至少检查本次提交自身，避免因无法解析旧 SHA 让 CI 提前失败。
            git diff-tree --check --no-commit-id -r "$CURRENT_SHA"
          else
            git diff --check "$BEFORE_SHA" "$CURRENT_SHA"
          fi

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: Check project contracts and dependency boundaries
        run: pnpm check:project

      - name: Lint
        run: pnpm lint

      - name: Test CI selection, runner, model metadata and release policy
        run: node --test scripts/ci-test-plan.test.mjs scripts/run-tests.test.mjs scripts/sync-model-metadata.test.mjs scripts/release-desktop.test.mjs scripts/ci-cjk-fonts.test.mjs

      - name: Test Code Mode runtime
        run: pnpm test:code-mode-runtime

  test:
    needs: [plan, static]
    if: needs.plan.outputs.standard == 'true'
    name: Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: ci-plan
          path: .ci
      - name: Test
        run: node scripts/run-tests.mjs --standard --plan=.ci/plan.json --shard=${{ matrix.shard }}/4 --report=test-timings.json

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: test-timings-${{ matrix.shard }}
          path: test-timings.json
          if-no-files-found: warn
          retention-days: 7

  e2e:
    needs: [plan, static]
    if: needs.plan.outputs.e2e == 'true'
    name: Runtime E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and Electron
        run: pnpm install --frozen-lockfile && pnpm exec install-electron --no

      - uses: actions/download-artifact@v8
        with:
          name: ci-plan
          path: .ci
      - name: Build CLI
        run: pnpm build:cli
      - name: Test built runtime end to end
        run: xvfb-run -a node scripts/run-tests.mjs --e2e --plan=.ci/plan.json

  build:
    needs: [plan, static]
    if: needs.plan.outputs.build == 'true'
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop
        run: pnpm build:desktop

      - name: Test packaged Code Mode runtime
        run: pnpm test:code-mode-package

  renderer:
    needs: [plan, static]
    if: needs.plan.outputs.renderer == 'true'
    name: Renderer UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and Electron
        run: pnpm install --frozen-lockfile && pnpm exec install-electron --no

      - name: Install CJK screenshot fonts
        timeout-minutes: 3
        run: |
          . /etc/os-release
          [[ "$ID" == ubuntu && "${VERSION_CODENAME:-}" =~ ^[a-z][a-z0-9]*$ ]]
          architecture="$(dpkg --print-architecture)"
          case "$architecture" in amd64|amd64v3) ;; *) echo 'Unsupported CJK font runner architecture' >&2; exit 1 ;; esac
          keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg
          test -f "$keyring"
          test -r "$keyring"
          apt_dir="$(mktemp -d /tmp/biny-cjk-apt.XXXXXX)"
          chmod 0755 "$apt_dir"
          mkdir -m 0755 "$apt_dir/lists" "$apt_dir/sources.list.d"
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://archive.ubuntu.com/ubuntu/' \
            "Suites: $VERSION_CODENAME $VERSION_CODENAME-updates $VERSION_CODENAME-security" \
            'Components: main' \
            "Architectures: $architecture" \
            "Signed-By: $keyring" > "$apt_dir/ubuntu.sources"
          chmod 0644 "$apt_dir/ubuntu.sources"
          apt_options=(
            -o "Dir::Etc::sourcelist=$apt_dir/ubuntu.sources"
            -o "Dir::Etc::sourceparts=$apt_dir/sources.list.d"
            -o "Dir::State::lists=$apt_dir/lists"
            -o Dir::Cache::pkgcache=
            -o Dir::Cache::srcpkgcache=
          )
          date -u '+%Y-%m-%dT%H:%M:%SZ CJK fonts: apt update start'
          sudo apt-get "${apt_options[@]}" update --error-on=any
          date -u '+%Y-%m-%dT%H:%M:%SZ CJK fonts: apt install start'
          sudo apt-get "${apt_options[@]}" install -y fonts-noto-cjk
          date -u '+%Y-%m-%dT%H:%M:%SZ CJK fonts: apt install complete'
          dpkg-query -W -f='${binary:Package} ${Version}\n' fonts-noto-cjk

      - name: Build production-component fixture
        env:
          BINY_DISCLOSURE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/build-memory-disclosure-fixture.mjs

      - name: Test real rendering and native keyboard input
        run: |
          xvfb-run -a --server-args="-screen 0 1600x2400x24" pnpm exec electron --no-sandbox scripts/memory-disclosure-browser.test.mjs
          node -e 'const r = require("./.memory-disclosure-results/results.json"); if (!r.passed || r.variants.length !== 4 || !r.input?.events.length) process.exit(1)'

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: memory-disclosure-renderer
          path: .memory-disclosure-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: [plan, static]
    if: needs.plan.outputs.windows == 'true'
    name: Windows compatibility
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test Windows platform and real shared Host
        run: node scripts/run-tests.mjs windows
      - name: Test owner election
        run: node scripts/run-tests.mjs runtime-host-lock
      - name: Test discovery and launch plans
        run: |
          node scripts/run-tests.mjs runtime-host-connection-options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/run-tests.mjs runtime-host-lifecycle
      - name: Prepare Electron native dependencies
        run: pnpm desktop:prepare
      - name: Build Desktop and CLI
        run: pnpm build:desktop
      - name: Validate built Electron Host
        run: node scripts/run-tests.mjs desktop-host-startup-e2e
      - name: Package Windows application
        if: needs.plan.outputs.windows_package == 'true'
        run: pnpm exec electron-builder --config config/electron-builder.yml --win nsis zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        if: needs.plan.outputs.windows_package == 'true'
        with:
          name: windows-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  validate:
    name: Validate
    if: ${{ always() }}
    needs: [plan, static, test, e2e, build, renderer, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: ci-plan
          path: .ci
      - name: Require exactly the selected validation lanes to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-test-plan.mjs --check-results
