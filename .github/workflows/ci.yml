name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changed patch
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              git diff --check HEAD^ HEAD
            else
              git diff-tree --check --no-commit-id -r HEAD
            fi
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            # 强制 push 或分支重建后，before SHA 可能不在当前 checkout 的历史里。
            # 此时至少检查本次提交自身，避免因无法解析旧 SHA 让 CI 提前失败。
            git diff-tree --check --no-commit-id -r "$CURRENT_SHA"
          else
            git diff --check "$BEFORE_SHA" "$CURRENT_SHA"
          fi

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: Check project contracts and dependency boundaries
        run: pnpm check:project

      - name: Lint
        run: pnpm lint

      - name: Test release policy
        run: node --test scripts/release-desktop.test.mjs

  test:
    name: Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test:standard --shard=${{ matrix.shard }}/4 --report=test-timings.json

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: test-timings-${{ matrix.shard }}
          path: test-timings.json
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: Runtime E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and Electron
        run: pnpm install --frozen-lockfile && pnpm exec install-electron --no

      - name: Test built runtime end to end
        run: xvfb-run -a pnpm test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build:cli

      - name: Build desktop
        run: pnpm build:desktop

      - name: Test packaged Code Mode runtime
        run: pnpm test:code-mode-package

  renderer:
    name: Renderer UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and Electron
        run: pnpm install --frozen-lockfile && pnpm exec install-electron --no

      - name: Install CJK screenshot fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Build production-component fixture
        env:
          BINY_DISCLOSURE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/build-memory-disclosure-fixture.mjs

      - name: Test real rendering and native keyboard input
        run: |
          xvfb-run -a --server-args="-screen 0 1600x2400x24" pnpm exec electron --no-sandbox scripts/memory-disclosure-browser.test.mjs
          node -e 'const r = require("./.memory-disclosure-results/results.json"); if (!r.passed || r.variants.length !== 4 || !r.input?.events.length) process.exit(1)'

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: memory-disclosure-renderer
          path: .memory-disclosure-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows compatibility
    needs: static
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test Windows platform and real shared Host
        run: node scripts/run-tests.mjs windows
      - name: Test owner election
        run: node scripts/run-tests.mjs runtime-host-lock
      - name: Test discovery and launch plans
        run: |
          node scripts/run-tests.mjs runtime-host-connection-options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/run-tests.mjs runtime-host-lifecycle
      - name: Prepare Electron native dependencies
        run: pnpm desktop:prepare
      - name: Build Desktop and CLI
        run: pnpm build:desktop
      - name: Validate built Electron Host
        run: node scripts/run-tests.mjs desktop-host-startup-e2e
      - name: Package Windows application
        run: pnpm exec electron-builder --config config/electron-builder.yml --win nsis zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  validate:
    name: Validate
    if: ${{ always() }}
    needs: [static, test, e2e, build, renderer, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all validation lanes to pass
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RENDERER_RESULT: ${{ needs.renderer.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          if [[ "$STATIC_RESULT" != "success" || "$TEST_RESULT" != "success" || "$E2E_RESULT" != "success" || "$BUILD_RESULT" != "success" || "$RENDERER_RESULT" != "success" || "$WINDOWS_RESULT" != "success" ]]; then
            echo "Static checks: $STATIC_RESULT"
            echo "Tests: $TEST_RESULT"
            echo "Runtime E2E: $E2E_RESULT"
            echo "Build: $BUILD_RESULT"
            echo "Renderer UI: $RENDERER_RESULT"
            echo "Windows compatibility: $WINDOWS_RESULT"
            exit 1
          fi
          echo "Static checks, tests, runtime E2E, builds, and renderer UI all passed."
